name: Build and Publish (Maven)

on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Parse CHANGELOG.md
        run: |
          VERSION=$(head -n 1 CHANGELOG.md | tr -d '\r' | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          tail -n +3 CHANGELOG.md | tr -d '\r' > RELEASE_NOTES.md

          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat RELEASE_NOTES.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Skip notice
        if: env.VERSION == 'DONOTUPLOAD'
        run: echo "::notice::VERSION=DONOTUPLOAD — Publish and build was skipped"

      - name: Build with Maven
        if: env.VERSION != 'DONOTUPLOAD'
        run: |
          mvn clean package -DskipTests

      - name: Publish to Modrinth
        if: env.VERSION != 'DONOTUPLOAD'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "2ACqapdC"
          modrinth-token: ${{ secrets.MODRINTH_PUBLISH }}
          version: ${{ env.VERSION }}
          name: "v${{ env.VERSION }}"
          files: |
            target/lazychat-${{ env.VERSION }}.jar
          changelog-file: RELEASE_NOTES.md
          loaders: |
            paper
            purpur
          game-versions: |
            1.20.x
            1.21.x
            26.x