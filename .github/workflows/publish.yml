name: Build and Publish (Maven)

on:
  push:
    branches:
      - master

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Parse CHANGELOG.md
        run: |
          VERSION=$(head -n 1 CHANGELOG.md | tr -d '\r' | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          tail -n +3 CHANGELOG.md | tr -d '\r' > RELEASE_NOTES.md
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat RELEASE_NOTES.md >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build with Maven
        run: |
          mvn clean package -DskipTests

      - name: Delete existing versions on Modrinth and Hangar
        run: |
          MODRINTH_VER_ID=$(curl -s -H "Authorization: ${{ secrets.MODRINTH_PUBLISH }}" \
            "https://modrinth.com" | \
            jq -r ".[] | select(.version_number == \"${{ env.VERSION }}\") | .id")

          if [ -n "$MODRINTH_VER_ID" ] && [ "$MODRINTH_VER_ID" != "null" ]; then
            echo "Deleting $MODRINTH_VER_ID from Modrinth..."
            curl -s -X DELETE -H "Authorization: ${{ secrets.MODRINTH_PUBLISH }}" \
              "https://modrinth.com"
          fi

          HANGAR_JWT=$(curl -s -X POST "https://papermc.io{{ secrets.HANGAR_PUBLISH }}" | jq -r '.token')

          if [ -n "$HANGAR_JWT" ] && [ "$HANGAR_JWT" != "null" ]; then
            echo "Try to delete ${{ env.VERSION }} if it exists..."
            curl -s -X DELETE -H "Authorization: HangarApi $HANGAR_JWT" \
              "https://papermc.io{{ env.VERSION }}" || true
          fi

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "2ACqapdC"
          modrinth-token: ${{ secrets.MODRINTH_PUBLISH }}
          version: ${{ env.VERSION }}
          name: "v${{ env.VERSION }}"
          files: |
            target/lazychat-${{ env.VERSION }}.jar
          changelog-file: RELEASE_NOTES.md
          loaders: |
            paper
            purpur
          game-versions: |
            1.20.x
            1.21.x
            26.x

      - name: Publish to Hangar
        uses: benwoo1110/hangar-upload-action@v1
        with:
          api_token: ${{ secrets.HANGAR_PUBLISH }}
          slug: "LazyChat"
          version: ${{ env.VERSION }}
          channel: "Release"
          description: ${{ env.CHANGELOG }}
          files: '[{"path": "target/lazychat-${{ env.VERSION }}.jar", "platforms": ["PAPER"], "platformVersions": ["1.20.x", "1.21.x", "26.x"]}]'
