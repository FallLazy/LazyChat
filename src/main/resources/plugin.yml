name: LazyChat-M
version: '${version}'
main: dev.falllazy.lazyChat.LazyChat
description: LazyChat but community
author: LazyCato0o
website: https://github.com/LazyCat0/LazyChat-MC-plugin
api-version: '1.21'
prefix: 'LazyChat - M'
softdepend:
  - LuckPerms
permissions:
  l-chat.reload:
    description: Gives access to reload plugin
    default: op
  l-chat.broadcast:
    description: Gives access to use /broadcast
    default: op
  l-chat.mute:
    description: Gives access for mute players
    default: op
  l-chat.advance_format:
    description: Allows to use MM anywhere, where it can used
    default: op
  l-chat.full-format-use:
    description: Allows to use all features of MiniMessage formatting
    default: op

commands:
  lazychat:
    description: Main command of plugin.
    aliases: [lc, l-chat, lazy-c, lazy-chat]
    usage: /<command> <info/reload/clear>
  lbroadcast:
    description: Broadcast a your message with better "style"
    aliases: [lbc]
    usage: /<command> <message>
    permission: l-chat.broadcast
  l-mute:
    description: Command for mute a player for a some time
    aliases: [l-mute, l-m, lm, lazy-mute, lazy-m]
    usage: /<command> <action> <player_name> <time>
    permission: l-chat.mute